name: Nightly ISO

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - backend: debian-preseed
            config: configs/vm.env
            distro: debian-13
    steps:
      - uses: actions/checkout@v4
      - name: Install build tooling
        run: sudo apt-get update; sudo apt-get install -y xorriso wget curl openssl
      - name: Prepare nightly config
        shell: bash
        env:
          SECRET_USERNAME: ${{ secrets.USERNAME }}
          SECRET_PASSWORD: ${{ secrets.PASSWORD }}
          SECRET_FULLNAME: ${{ secrets.FULLNAME }}
          SECRET_HOSTNAME: ${{ secrets.HOSTNAME }}
          SECRET_SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SECRET_DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          }

          set_config_value() {
            local file="$1"
            local key="$2"
            local value="$3"
            local escaped
            local tmp

            printf -v escaped '%q' "$value"
            tmp="$(mktemp)"
            grep -v "^${key}=" "$file" > "$tmp" || true
            printf '%s=%s\n' "$key" "$escaped" >> "$tmp"
            mv "$tmp" "$file"
          }

          require_secret USERNAME "$SECRET_USERNAME"
          require_secret PASSWORD "$SECRET_PASSWORD"
          require_secret FULLNAME "$SECRET_FULLNAME"
          require_secret HOSTNAME "$SECRET_HOSTNAME"
          require_secret SSH_PUBLIC_KEY "$SECRET_SSH_PUBLIC_KEY"
          cp "${{ matrix.config }}" .nightly.env
          set_config_value .nightly.env USERNAME "$SECRET_USERNAME"
          set_config_value .nightly.env PASSWORD "$SECRET_PASSWORD"
          set_config_value .nightly.env FULLNAME "$SECRET_FULLNAME"
          set_config_value .nightly.env HOSTNAME "$SECRET_HOSTNAME"
          set_config_value .nightly.env SSH_PUBLIC_KEY "$SECRET_SSH_PUBLIC_KEY"
          set_config_value .nightly.env DOMAIN "$SECRET_DOMAIN"
          sed -i "s/^INSTALLER_VERSION=.*/INSTALLER_VERSION=nightly-${GITHUB_RUN_NUMBER}/" .nightly.env
      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh --config .nightly.env --arches amd64,arm64
      - name: Prepare nightly assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/nightly
          for arch in amd64 arm64; do
            iso_name="omnixys-${{ matrix.distro }}-${arch}-nightly.iso"
            iso_path="artifacts/nightly/${iso_name}"
            cp "output/omnixys-debian-13-${arch}-auto.iso" "$iso_path"
            sha256sum "$iso_path" > "${iso_path}.sha256"
          done
          echo "glob=artifacts/nightly/*" >> "$GITHUB_OUTPUT"
      - name: Upload nightly workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.backend }}-${{ github.run_number }}
          path: ${{ steps.assets.outputs.glob }}
          retention-days: 14
      - name: Publish nightly pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build from commit ${{ github.sha }}.
          files: ${{ steps.assets.outputs.glob }}
          fail_on_unmatched_files: true
