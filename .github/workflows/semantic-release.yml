name: Semantic Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.OMNIXYS_TOKEN || github.token }}
      - name: Attach verified commit to main
        run: git checkout -B main "${{ github.event.workflow_run.head_sha }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run semantic-release
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.OMNIXYS_TOKEN || github.token }}
