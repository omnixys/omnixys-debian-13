name: Release

on:
  workflow_run:
    workflows: [Semantic Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach assets to (for manual reruns)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Resolve verified release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            if [[ -z "$tag" ]]; then
              echo "Manual run requires inputs.tag" >&2
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              echo "Release tag does not exist: ${tag}" >&2
              exit 1
            fi
          else
            tag="$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n 1)"
            if [[ -z "$tag" ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Semantic Release completed without creating a release tag"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  release-assets:
    needs: release-gate
    if: needs.release-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - backend: debian-preseed
            config: configs/production.env
            distro: debian-13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gate.outputs.tag }}
      - name: Install build tooling
        run: sudo apt-get update; sudo apt-get install -y xorriso wget curl openssl
      - name: Prepare release config
        shell: bash
        env:
          SECRET_USERNAME: ${{ secrets.USERNAME }}
          SECRET_PASSWORD: ${{ secrets.PASSWORD }}
          SECRET_FULLNAME: ${{ secrets.FULLNAME }}
          SECRET_HOSTNAME: ${{ secrets.HOSTNAME }}
          SECRET_SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SECRET_DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set -euo pipefail

          require_secret() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          }

          set_config_value() {
            local file="$1"
            local key="$2"
            local value="$3"
            local escaped
            local tmp

            printf -v escaped '%q' "$value"
            tmp="$(mktemp)"
            grep -v "^${key}=" "$file" > "$tmp" || true
            printf '%s=%s\n' "$key" "$escaped" >> "$tmp"
            mv "$tmp" "$file"
          }

          require_secret USERNAME "$SECRET_USERNAME"
          require_secret PASSWORD "$SECRET_PASSWORD"
          require_secret FULLNAME "$SECRET_FULLNAME"
          require_secret HOSTNAME "$SECRET_HOSTNAME"
          require_secret SSH_PUBLIC_KEY "$SECRET_SSH_PUBLIC_KEY"
          cp "${{ matrix.config }}" .release.env
          set_config_value .release.env USERNAME "$SECRET_USERNAME"
          set_config_value .release.env PASSWORD "$SECRET_PASSWORD"
          set_config_value .release.env FULLNAME "$SECRET_FULLNAME"
          set_config_value .release.env HOSTNAME "$SECRET_HOSTNAME"
          set_config_value .release.env SSH_PUBLIC_KEY "$SECRET_SSH_PUBLIC_KEY"
          set_config_value .release.env DOMAIN "$SECRET_DOMAIN"
          sed -i "s/^INSTALLER_VERSION=.*/INSTALLER_VERSION=${{ needs.release-gate.outputs.version }}/" .release.env
      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh --config .release.env --arches amd64,arm64
      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          for arch in amd64 arm64; do
            base_name="omnixys-${{ matrix.distro }}-${arch}-${{ needs.release-gate.outputs.version }}"
            iso_path="artifacts/release/${base_name}.iso"
            cp "output/omnixys-debian-13-${arch}-auto.iso" "$iso_path"
            sha256sum "$iso_path" > "${iso_path}.sha256"
          done

          echo "glob=artifacts/release/*" >> "$GITHUB_OUTPUT"
      - name: Upload release workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.backend }}-${{ needs.release-gate.outputs.version }}
          path: ${{ steps.assets.outputs.glob }}
          retention-days: 30
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-gate.outputs.tag }}
          files: ${{ steps.assets.outputs.glob }}
          fail_on_unmatched_files: true
          append_body: false
      - name: Package changelog checksum
        run: |
          sha256sum CHANGELOG.md > CHANGELOG.md.sha256
      - name: Upload changelog checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog-${{ needs.release-gate.outputs.version }}
          path: CHANGELOG.md.sha256

  release-assets-vm:
    needs: [release-gate, release-assets]
    if: needs.release-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-gate.outputs.tag }}
      - name: Install build tooling
        run: sudo apt-get update; sudo apt-get install -y xorriso wget curl openssl
      - name: Prepare VM release config
        shell: bash
        run: |
          set -euo pipefail
          cp configs/vm.env .release.env
          sed -i "s/^INSTALLER_VERSION=.*/INSTALLER_VERSION=${{ needs.release-gate.outputs.version }}/" .release.env
          # Published VM release images must never carry a baked identity.env.
          # Runtime usb-env identity (OMNIXYS_ID) is applied at install time and
          # is independent of this build-time embed policy.
          grep -v "^IDENTITY_EMBED=" .release.env > .release.env.tmp || true
          printf 'IDENTITY_EMBED=false\n' >> .release.env.tmp
          mv .release.env.tmp .release.env
      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh --config .release.env --arches amd64,arm64
      - name: Verify VM release image is identity-free
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            iso="output/omnixys-debian-13-${arch}-auto.iso"
            # xorriso -find prints the entry (quoted) when present; nothing when absent.
            if [ -n "$(xorriso -indev "$iso" -find /identity.env 2>/dev/null | tr -d "'[:space:]")" ]; then
              echo "::error::Release VM ISO $iso unexpectedly contains /identity.env" >&2
              exit 1
            fi
          done
          echo "Verified: no /identity.env in release VM images"
      - name: Prepare VM release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          for arch in amd64 arm64; do
            base_name="omnixys-debian-13-${arch}-${{ needs.release-gate.outputs.version }}-vm"
            iso_path="artifacts/release/${base_name}.iso"
            cp "output/omnixys-debian-13-${arch}-auto.iso" "$iso_path"
            sha256sum "$iso_path" > "${iso_path}.sha256"
          done

          echo "glob=artifacts/release/*" >> "$GITHUB_OUTPUT"
      - name: Upload VM release workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-debian-preseed-vm-${{ needs.release-gate.outputs.version }}
          path: ${{ steps.assets.outputs.glob }}
          retention-days: 30
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-gate.outputs.tag }}
          files: ${{ steps.assets.outputs.glob }}
          fail_on_unmatched_files: true
          append_body: false
