name: CI

on:
  push:
  pull_request:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update; sudo apt-get install -y shellcheck
      - name: Core shellcheck
        run: |
          chmod +x build.sh
          find core -name '*.sh' -print0 | xargs -0 -r chmod +x
          shellcheck build.sh
          find core -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Core tests
        run: |
          chmod +x tests/test-core.sh
          ./tests/test-core.sh

  test-installer:
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update; sudo apt-get install -y shellcheck
      - name: Installer shellcheck
        run: |
          find installer -name '*.sh' -print0 | xargs -0 -r chmod +x
          find installer -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Installer tests
        run: |
          chmod +x tests/test-installer-debian-preseed.sh
          chmod +x tests/test-renderer-template.sh
          chmod +x tests/test-validator-rules.sh
          chmod +x tests/test-builder-remaster.sh
          ./tests/test-installer-debian-preseed.sh
          ./tests/test-renderer-template.sh
          ./tests/test-validator-rules.sh
          ./tests/test-builder-remaster.sh

  test-modules:
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update; sudo apt-get install -y shellcheck
      - name: Module shellcheck
        run: |
          find modules -name '*.sh' -print0 | xargs -0 -r chmod +x
          find modules -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Module tests
        run: |
          chmod +x tests/test-modules.sh
          chmod +x tests/test-module-manager.sh
          ./tests/test-modules.sh
          ./tests/test-module-manager.sh

  test-iso:
    needs: [test-installer, test-modules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tooling
        run: sudo apt-get update; sudo apt-get install -y xorriso curl wget openssl
      - name: Dry-run pipeline
        run: |
          chmod +x build.sh
          chmod +x tests/test-dry-run.sh
          ./tests/test-dry-run.sh

  test-boot-tools:
    needs: test-iso
    runs-on: ubuntu-latest
    steps:
      - name: Install boot test tooling
        run: sudo apt-get update; sudo apt-get install -y qemu-system-x86 ovmf
      - name: Verify tooling availability
        run: |
          qemu-system-x86_64 --version
          test -f /usr/share/OVMF/OVMF_CODE.fd || test -f /usr/share/OVMF/OVMF_CODE_4M.fd
