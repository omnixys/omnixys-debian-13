name: CI

on:
  push:
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint commit messages
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="$(git merge-base origin/main HEAD)"
          else
            base="${{ github.event.before }}"
          fi
          if [[ "${base}" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD | head -1)"
          fi
          pnpm exec commitlint --from "${base}" --to HEAD

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update; sudo apt-get install -y shellcheck
      - name: Core shellcheck
        run: |
          chmod +x build.sh
          find core -name '*.sh' -print0 | xargs -0 -r chmod +x
          shellcheck build.sh
          find core -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Core tests
        run: |
          chmod +x tests/test-core.sh
          ./tests/test-core.sh

  test-installer:
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update; sudo apt-get install -y shellcheck
      - name: Installer shellcheck
        run: |
          find installer -name '*.sh' -print0 | xargs -0 -r chmod +x
          find installer -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Installer tests
        run: |
          chmod +x tests/test-installer-debian-preseed.sh
          chmod +x tests/test-renderer-template.sh
          chmod +x tests/test-validator-rules.sh
          chmod +x tests/test-builder-remaster.sh
          chmod +x tests/test-identity.sh
          ./tests/test-installer-debian-preseed.sh
          ./tests/test-renderer-template.sh
          ./tests/test-validator-rules.sh
          ./tests/test-builder-remaster.sh
          ./tests/test-identity.sh

  test-modules:
    needs: test-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update; sudo apt-get install -y shellcheck
      - name: Module shellcheck
        run: |
          find modules -name '*.sh' -print0 | xargs -0 -r chmod +x
          find modules -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Module tests
        run: |
          chmod +x tests/test-modules.sh
          chmod +x tests/test-module-manager.sh
          ./tests/test-modules.sh
          ./tests/test-module-manager.sh

  test-iso:
    needs: [test-installer, test-modules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tooling
        run: sudo apt-get update; sudo apt-get install -y xorriso curl wget openssl
      - name: Dry-run pipeline
        run: |
          chmod +x build.sh
          chmod +x tests/test-dry-run.sh
          ./tests/test-dry-run.sh

  test-boot-tools:
    needs: test-iso
    runs-on: ubuntu-latest
    steps:
      - name: Install boot test tooling
        run: sudo apt-get update; sudo apt-get install -y qemu-system-x86 ovmf
      - name: Verify tooling availability
        run: |
          qemu-system-x86_64 --version
          test -f /usr/share/OVMF/OVMF_CODE.fd || test -f /usr/share/OVMF/OVMF_CODE_4M.fd

  build-artifact:
    needs: test-iso
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - backend: debian-preseed
            config: configs/vm.env
    steps:
      - uses: actions/checkout@v4
      - name: Install build tooling
        run: sudo apt-get update; sudo apt-get install -y xorriso wget curl openssl
      - name: Build ISO
        run: |
          chmod +x build.sh
          ./build.sh --config "${{ matrix.config }}" --arches amd64,arm64
      - name: Prepare artifact payload
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          mkdir -p artifacts/ci
          for arch in amd64 arm64; do
            iso_src="output/omnixys-debian-13-${arch}-auto.iso"
            iso_name="omnixys-${{ matrix.backend }}-${arch}-${short_sha}.iso"
            cp "$iso_src" "artifacts/ci/${iso_name}"
            sha256sum "artifacts/ci/${iso_name}" > "artifacts/ci/${iso_name}.sha256"
          done
      - name: Upload CI ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.backend }}-${{ github.sha }}
          path: artifacts/ci/*
          retention-days: 7
